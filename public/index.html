/* ============================================================ árvore campanha › conjunto › anúncio
   Métricas de anúncio (gasto/impressões/…) ficam na folha (anúncio) e sobem
   somando. As vendas entram no nível em que a UTM casou (anúncio, conjunto ou
   campanha) e também sobem — assim a campanha mostra o total real mesmo quando
   a venda só casou até um nível acima. */
function buildTree(from, to){
  const tax = DATA.meta.tax;
  const root = new Map();
  const mk = label => Object.assign(blank(), {label, kids:new Map()});
  const camp = c => { let n = root.get(c); if (!n){ n = mk(c); root.set(c, n); } return n; };
  const set  = (cp,s) => { let n = cp.kids.get(s); if (!n){ n = mk(s); cp.kids.set(s, n); } return n; };
  const ad   = (as,a) => { let n = as.kids.get(a); if (!n){ n = mk(a); as.kids.set(a, n); } return n; };

  for (const r of DATA.ads) if (r.d >= from && r.d <= to) accAd(ad(set(camp(r.c), r.s), r.a), r, tax);
  const un = blank();
  for (const s of DATA.sales) if (s.d >= from && s.d <= to && saleInScope(s)){
    if (s.m === "ad")            accSale(ad(set(camp(s.c), s.s), s.a), s);
    else if (s.m === "adset")    accSale(set(camp(s.c), s.s), s);
    else if (s.m === "campaign") accSale(camp(s.c), s);
    else                         accSale(un, s);   // sem campanha casada (UTM não bateu / orgânico)
  }
  const roll = (node, key, level) => {
    const kids = [...node.kids.entries()].map(([lbl,ch]) => roll(ch, key + "␀" + lbl, level + 1));
    const agg = blank();
    for (const k of RAW) agg[k] = node[k];
    for (const c of kids) for (const k of RAW) agg[k] += c[k];
    const d = derive(agg);
    d.label = node.label; d.key = key; d.level = level; d.kids = kids;
    return d;
  };
  return {camps:[...root.entries()].map(([lbl,n]) => roll(n, lbl, 0)), un:derive(un)};
}

function sortNodes(list, key, dir){
  return list.slice().sort((a,b) => {
    if (key === "label") return dir * a.label.localeCompare(b.label, "pt-BR");
    const av = a[key], bv = b[key], an = av === null || !isFinite(av), bn = bv === null || !isFinite(bv);
    if (an && bn) return 0; if (an) return 1; if (bn) return -1;
    return dir * (av - bv);
  });
}
function flatten(camps){
  const {key, dir} = STATE.treeSort, out = [];
  for (const c of sortNodes(camps, key, dir)){
    out.push(c);
    if (STATE.expanded.has(c.key)) for (const s of sortNodes(c.kids, key, dir)){
      out.push(s);
      if (STATE.expanded.has(s.key)) for (const a of sortNodes(s.kids, key, dir)) out.push(a);
    }
  }
  return out;
}

function renderOpt(){
  const {camps, un} = buildTree(STATE.from, STATE.to);
  const {key, dir} = STATE.treeSort;

  // Escala de cor calibrada no nível de campanha (baseline estável).
  const scales = {};
  for (const c of TCOLS.filter(c => c.scale)){
    const vals = camps.filter(r => r.spend > 0 && r[c.k] !== null && isFinite(r[c.k])).map(r => r[c.k]);
    if (vals.length > 1) scales[c.k] = {min:Math.min(...vals), max:Math.max(...vals), dir:c.scale};
  }
  const shade = (k, v) => {
    const s = scales[k];
    if (!s || v === null || !isFinite(v) || s.max === s.min) return "";
    let t = (v - s.min)/(s.max - s.min);
    if (s.dir === "low") t = 1 - t;
    if (t < 0.15) return "";
    return `background:color-mix(in srgb,var(--scale-ink) ${Math.round(t*32)}%,transparent)`;
  };

  const head = TCOLS.map(c => {
    const active = key === c.k;
    const arw = active ? (dir === 1 ? "▲" : "▼") : "▾";
    return `<th data-k="${c.k}"${active ? " data-active" : ""} title="${c.hint || "ordenar"}">${c.label}<span class="arw">${arw}</span></th>`;
  }).join("");

  const rowHTML = r => {
    const exp = r.level < 2 && r.kids && r.kids.length > 0;
    const open = STATE.expanded.has(r.key);
    const caret = `<span class="caret">${exp ? "▸" : ""}</span>`;
    return `<tr class="lv${r.level}${exp ? " exp" : ""}${open ? " open" : ""}" data-key="${encodeURIComponent(r.key)}">
      <td><span class="nm">${caret}${escape_(r.label)}</span></td>
      ${TCOLS.slice(1).map(c => {
        const st = c.scale ? shade(c.k, r[c.k]) : "";
        const v = c.fmt(r[c.k]);
        return `<td>${st ? `<span class="cell-scale" style="${st}">${v}</span>` : v}</td>`;
      }).join("")}
    </tr>`;
  };

  const tot = derive(camps.reduce((t,r) => { for (const k of RAW) t[k] += r[k]; return t; }, blank()));
  const rows = flatten(camps);
  const unLabel = STATE.mode === "total"
    ? "— sem campanha (orgânico/direto ou UTM não casada) —"
    : "— tráfego sem campanha casada (UTM não bateu) —";
  const unRow = un.sales > 0
    ? `<tr class="lv0 muted-row"><td><span class="nm"><span class="caret"></span>${unLabel}</span></td>${TCOLS.slice(1).map(c => `<td>${c.k === "sales" || c.k === "rev" ? c.fmt(un[c.k]) : "—"}</td>`).join("")}</tr>`
    : "";

  document.getElementById("tbl").innerHTML = `
    <thead><tr>${head}</tr></thead>
    <tbody>${rows.map(rowHTML).join("") || `<tr><td colspan="${TCOLS.length}" style="text-align:center;color:var(--ink-3);padding:32px">Nenhum dado no período.</td></tr>`}${unRow}</tbody>
    <tfoot><tr><td>Total — ${camps.length} campanha(s)</td>${TCOLS.slice(1).map(c => `<td>${c.fmt(tot[c.k])}</td>`).join("")}</tr></tfoot>`;

  document.querySelectorAll("#tbl tbody tr.exp").forEach(tr => {
    tr.querySelector("td:first-child").onclick = () => {
      const k = decodeURIComponent(tr.dataset.key);
      if (STATE.expanded.has(k)) STATE.expanded.delete(k); else STATE.expanded.add(k);
      renderOpt();
    };
  });
  document.querySelectorAll("#tbl thead th").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.k;
      STATE.treeSort = (key === k) ? {key:k, dir:-dir} : {key:k, dir:k === "label" ? 1 : -1};
      renderOpt();
    };
  });
}

/* ============================================================ visão diária */
function renderDaily(){
  const rows = daily(STATE.from, STATE.to).reverse();   // mais recente no topo
  const scales = {};
  for (const c of DCOLS.filter(c => c.scale)){
    const vals = rows.filter(r => r.spend > 0 && r[c.k] !== null && isFinite(r[c.k])).map(r => r[c.k]);
    if (vals.length > 1) scales[c.k] = {min:Math.min(...vals), max:Math.max(...vals), dir:c.scale};
  }
  const heat = (k, v) => {
    const s = scales[k];
    if (!s || v === null || !isFinite(v) || s.max === s.min) return "";
    let t = (v - s.min)/(s.max - s.min);
    if (s.dir === "low") t = 1 - t;                       // t=1 bom (verde), t=0 ruim (vermelho)
    const hue = t >= 0.5 ? "var(--good)" : "var(--critical)";
    const strength = Math.round(Math.abs(t - 0.5) * 2 * 32);
    return strength < 6 ? "" : `background:color-mix(in srgb,${hue} ${strength}%,transparent)`;
  };
  const head = DCOLS.map(c => `<th title="${c.hint || ""}">${c.label}</th>`).join("");
  const body = rows.map(r => `<tr>${DCOLS.map(c => {
    if (c.k === "d") return `<td>${dayFull(r.d)}</td>`;
    const st = c.scale ? heat(c.k, r[c.k]) : "";
    const v = c.fmt(r[c.k]);
    return `<td>${st ? `<span class="cell-scale" style="${st}">${v}</span>` : v}</td>`;
  }).join("")}</tr>`).join("");
  document.getElementById("dtbl").innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
}

/* ============================================================ relatório
   Gera automaticamente, pelo período selecionado, um relatório no padrão Scale:
   visual + textos em linguagem simples + insights/gargalos. Botão copia o texto. */

/* Métricas agregadas por NOME de anúncio (tráfego), somando todas as veiculações. */
function adsByName(from, to){
  const tax = DATA.meta.tax, map = new Map();
  const g = a => { let n = map.get(a); if (!n){ n = Object.assign(blank(), {label:a}); map.set(a, n); } return n; };
  for (const r of DATA.ads) if (r.d >= from && r.d <= to) accAd(g(r.a), r, tax);
  for (const s of DATA.sales) if (s.d >= from && s.d <= to && isTraffic(s) && s.m === "ad") accSale(g(s.a), s);
  return [...map.values()].map(derive).filter(a => a.spend > 0 || a.sales > 0);
}

function renderReport(){
  const {from, to} = STATE, days = diffDays(from, to) + 1;
  const pTo = addDays(from, -1), pFrom = addDays(pTo, -(days-1));
  const sm = STATE.mode;
  STATE.mode = "total";   const tot = aggregate(from, to),  dTot  = daily(from, to);
  STATE.mode = "traffic"; const traf = aggregate(from, to), trafPrev = aggregate(pFrom, pTo), dTraf = daily(from, to), tree = buildTree(from, to);
  STATE.mode = sm;
  const ads = adsByName(from, to);
  const T = CAC_GOAL;
  const perLabel = days === 1 ? dayFull(from) : `${dayFull(from)} a ${dayFull(to)} · ${days} dias`;
  const over = traf.cac != null && traf.cac > T;
  const repCac = c => c == null || !isFinite(c) ? "—" : `<b style="color:${c <= T ? "var(--good-text)" : "var(--critical)"}">${M.money(c)}</b>`;
  const dTbl = rows => `<div class="tblwrap"><table class="daily" style="min-width:520px"><thead><tr>
      <th style="text-align:left">Dia</th><th>Gasto</th><th>Vendas</th><th>CAC</th><th>ROAS</th><th>Conv.Checkout</th></tr></thead>
    <tbody>${[...rows].reverse().map(r => `<tr><td style="text-align:left">${dayFull(r.d)}</td><td>${M.money(r.spend)}</td><td>${int(r.sales)}</td><td>${repCac(r.cac)}</td><td>${M.x(r.roas)}</td><td>${M.pct1(r.convCheck)}</td></tr>`).join("")}</tbody></table></div>`;

  /* =================== SEÇÕES VISUAIS (limpas — prontas pro print) =================== */
  const secVisual = `
    <div class="rep-sec">
      <div class="step">1 · VISÃO GERAL</div>
      <h3>📊 Funil no total</h3>
      <div class="rep-stats">
        ${repStat("Investimento", M.money(tot.spend))}
        ${repStat("Receita total", M.money(tot.allRev))}
        ${repStat("Vendas totais", int(tot.allSales))}
        ${repStat("ROAS total", M.x(tot.roas))}
        ${repStat("CAC total", M.money(tot.cac))}
      </div>
    </div>
    <div class="rep-sec">
      <div class="step">2 · TRÁFEGO PAGO</div>
      <h3>🎯 Só o tráfego (o que a mídia gera)</h3>
      <div class="rep-stats">
        ${repStat("Investimento", M.money(traf.spend))}
        ${repStat("Receita tráfego", M.money(traf.trafRev))}
        ${repStat("Vendas tráfego", int(traf.sales))}
        ${repStat("CAC tráfego", repCac(traf.cac))}
        ${repStat("Meta de CAC", M.money(T))}
      </div>
    </div>
    <div class="rep-sec">
      <div class="step">3 · DIA A DIA</div>
      <h3>📅 Funil dia a dia</h3>
      <div class="bt" style="font-size:12px;font-weight:700;color:var(--ink-2);margin:4px 0 6px">Funil total (todas as vendas)</div>
      ${dTbl(dTot)}
      <div class="bt" style="font-size:12px;font-weight:700;color:var(--ink-2);margin:16px 0 6px">Funil só tráfego pago (utm_source = ${escape_(DATA.meta.traffic_source||"meta-ads")})</div>
      ${dTbl(dTraf)}
    </div>
    <div class="rep-sec">
      <div class="step">4 · CAMPANHAS</div>
      <h3>🗂️ Campanhas</h3>
      <div class="tblwrap"><table class="daily" style="min-width:520px"><thead><tr>
        <th style="text-align:left">Campanha</th><th>Gasto</th><th>Vendas</th><th>CAC</th><th>ROAS</th><th>Conv.Checkout</th>
      </tr></thead><tbody>${tree.camps.filter(c=>c.spend>0).sort((a,b)=>b.spend-a.spend).map(c => `<tr>
        <td style="text-align:left">${escape_(c.label)}</td><td>${M.money(c.spend)}</td><td>${int(c.sales)}</td><td>${repCac(c.cac)}</td><td>${M.x(c.roas)}</td><td>${M.pct1(c.convCheck)}</td></tr>`).join("")}</tbody></table></div>
    </div>
    <div class="rep-sec">
      <div class="step">5 · MELHORES ANÚNCIOS</div>
      <h3>🏆 Destaques pra produzir mais</h3>
      ${(() => {
        const b = ads.filter(a => a.sales > 0).sort((a,z) => (z.sales - a.sales) || (a.cac - z.cac)).slice(0, 6);
        return b.length ? b.map(a => `<div class="rep-ad">
          <div><span class="nm">${escape_(a.label)}</span> <span class="mt">· ${int(a.sales)} vendas · CAC ${M.money(a.cac)} · ${M.money(a.spend)} gastos</span></div>
          <input data-adlink="${encodeURIComponent(a.label)}" placeholder="cole o link do anúncio (Instagram)">
        </div>`).join("") : `<p class="rep-p muted">Sem vendas atribuídas a um anúncio específico no período.</p>`;
      })()}
    </div>`;

  /* =================== BRIEFING DO GESTOR (interno, profundo) =================== */
  const brief = [];   // {t, h, x}
  const nf = v => v == null || !isFinite(v) ? "—" : nf1.format(v);

  // -- leitura geral --
  const orgShare = tot.allSales > 0 ? traf.orgSales / tot.allSales : 0;
  const xGeral = `Investimento ${M.money(traf.spend)} no período. Total: ${int(tot.allSales)} vendas (${M.money(tot.allRev)}), CAC total ${M.money(tot.cac)}. Só mídia: ${int(traf.sales)} vendas (${M.money(traf.trafRev)}), CAC ${M.money(traf.cac)}. Orgânico/direto: ${int(traf.orgSales)} vendas = ${M.pct1(orgShare)} do total. `
    + (traf.orgSales > 0 ? `Atenção: o orgânico puxa o CAC total pra baixo (${M.money(tot.cac)}), mas a régua de mídia é o CAC do tráfego (${M.money(traf.cac)}).` : `Praticamente tudo veio de mídia paga no período.`);
  brief.push({t:"Leitura geral", h:`<p>${xGeral}</p>`, x:xGeral});

  // -- tráfego (decomposição) --
  const gap = traf.cac != null ? traf.cac - T : null;
  const clkPerSale = div(traf.clk, traf.sales);
  const cpcCeil = (traf.conv != null && isFinite(traf.conv)) ? T * traf.conv : null;
  const convNeeded = (traf.cpc != null && traf.cpc > 0) ? traf.cpc / T : null;
  let xTraf = traf.cac == null ? "Sem vendas de tráfego no período — sem CAC pra avaliar."
    : `CAC do tráfego ${M.money(traf.cac)} vs meta ${M.money(T)} (${over ? `+${M.money(gap)} acima` : `${M.money(-gap)} de folga`}). `
      + (trafPrev.cac != null && isFinite(trafPrev.cac) ? `Vs período anterior: ${traf.cac < trafPrev.cac ? "caiu" : "subiu"} de ${M.money(trafPrev.cac)}. ` : "")
      + `Anatomia: cada venda custou ~${nf(clkPerSale)} cliques a ${M.money(traf.cpc)} cada. `
      + (over && cpcCeil != null ? `Pra bater a meta sem mexer na conversão, o CPC precisa cair pra ${M.money(cpcCeil)} (${M.pct1((traf.cpc - cpcCeil)/traf.cpc)} mais barato) — OU, mantendo o CPC, a conversão clique→venda subir de ${M.pct1(traf.conv)} pra ${M.pct1(convNeeded)}.`
        : !over ? `Tem folga: dá pra escalar sem estourar, de olho pra o CPC/conversão não piorarem.` : "");
  brief.push({t:"Tráfego — decomposição do CAC", h:`<p>${xTraf}</p>`, x:xTraf});

  // -- dia a dia --
  const ds = dTraf.filter(r => r.sales > 0);
  let xDia;
  if (ds.length){
    const best = ds.reduce((a,b) => b.cac < a.cac ? b : a);
    const worst = ds.reduce((a,b) => b.cac > a.cac ? b : a);
    const mid = Math.ceil(ds.length/2);
    const wavg = arr => { const s = arr.reduce((x,r) => x + r.spend, 0), v = arr.reduce((x,r) => x + r.sales, 0); return v > 0 ? s/v : null; };
    const early = wavg(ds.slice(0, mid)), late = wavg(ds.slice(mid));
    const trend = (early != null && late != null && ds.length >= 3) ? (late < early ? "CAC vem caindo nos dias recentes (bom)." : late > early ? "CAC subiu nos dias recentes (de olho)." : "CAC estável.") : "";
    const heavy = dTraf.filter(r => r.spend > 0 && r.cac != null && r.cac > T).sort((a,b) => b.spend - a.spend)[0];
    xDia = `Melhor dia ${dayFull(best.d)} (CAC ${M.money(best.cac)}, ${int(best.sales)} vd) · pior ${dayFull(worst.d)} (CAC ${M.money(worst.cac)}). ${trend}`
      + (heavy ? ` Dia mais caro em verba acima da meta: ${dayFull(heavy.d)} (${M.money(heavy.spend)} gastos, CAC ${M.money(heavy.cac)}) — vale revisar o que rodou nesse dia.` : "");
  } else xDia = "Sem vendas de tráfego dia a dia no período.";
  brief.push({t:"Dia a dia", h:`<p>${xDia}</p>`, x:xDia});

  // -- campanhas (estratégico, sem saber o que já foi pausado) --
  const active = tree.camps.filter(c => c.spend > 0);
  const scale = active.filter(c => c.cac != null && c.cac <= T && c.sales >= 2).sort((a,b) => a.cac - b.cac);
  const cut   = active.filter(c => c.spend >= T && (c.sales === 0 || (c.cac != null && c.cac > 1.5*T))).sort((a,b) => b.spend - a.spend);
  const watch = active.filter(c => !scale.includes(c) && !cut.includes(c)).sort((a,b) => b.spend - a.spend);
  const line = (c, extra) => `<li><b>${escape_(c.label)}</b> — ${M.money(c.spend)} gastos, ${int(c.sales)} vd, CAC ${repCac(c.cac)}. ${extra}</li>`;
  const campHtml = `
    ${scale.length ? `<p><span class="rep-flag g">ESCALAR</span> CAC dentro da meta e com volume — dá pra subir orçamento:</p><ul>${scale.slice(0,5).map(c => line(c, "tem espaço pra mais verba.")).join("")}</ul>` : ""}
    ${cut.length ? `<p style="margin-top:10px"><span class="rep-flag r">CORTAR / REVISAR</span> drenando verba (CAC alto ou sem venda):</p><ul>${cut.slice(0,5).map(c => line(c, c.sales === 0 ? "gastou e não vendeu — candidata a pausar." : "CAC muito acima da meta — pausar os piores anúncios ou revisar público/criativo.")).join("")}</ul>` : ""}
    ${watch.length ? `<p style="margin-top:10px"><span class="rep-flag y">OBSERVAR</span> pouco volume/gasto — ainda sem dado pra decidir:</p><ul>${watch.slice(0,4).map(c => line(c, "esperar mais dado ou dar um empurrão pequeno.")).join("")}</ul>` : ""}
    <p class="rep-p muted" style="margin-top:8px">Não sei o que você já pausou — isto é um raio-x do momento pra você decidir onde mexer.</p>`;
  const campX = `Escalar: ${scale.slice(0,5).map(c => c.label + " (CAC " + M.money(c.cac) + ")").join("; ") || "—"}.\nCortar/revisar: ${cut.slice(0,5).map(c => c.label + " (" + M.money(c.spend) + ", " + int(c.sales) + " vd)").join("; ") || "—"}.\nObservar: ${watch.slice(0,4).map(c => c.label).join("; ") || "—"}.`;
  brief.push({t:"Campanhas — o que fazer", h:campHtml, x:campX});

  // -- insights (gargalo por BANDA de mercado, não pelo menor número absoluto) --
  const ins = [];
  const cr = traf.cr, lp = traf.lpCheck, cc = traf.convCheck;
  let primary = null;
  if (cr != null && lp != null && cc != null){
    ins.push(["🔎", `<b>Caminho depois do clique:</b> de cada 100 cliques, ~${Math.round(cr*100)} chegam na página, ~${Math.round(cr*lp*100)} iniciam checkout e ~${(cr*lp*cc*100).toFixed(1)} compram.`]);
    const stgs = [
      {b:FUNNEL_BANDS.cr,        v:cr, p:trafPrev.cr},
      {b:FUNNEL_BANDS.lpCheck,   v:lp, p:trafPrev.lpCheck},
      {b:FUNNEL_BANDS.convCheck, v:cc, p:trafPrev.convCheck}
    ].map(s => ({...s, st:stageStatus(s.v, s.b)}));
    ins.push(["🚦", `<b>Etapas vs mercado:</b> ` + stgs.map(s => `${s.b.label.split(" (")[0]} <span class="rep-flag ${s.st.cls}">${M.pct1(s.v)}</span>`).join(" · ")]);
    const rank = {bad:0, warn:1, good:2};
    const flagged = stgs.filter(s => s.st.level !== "good")
      .sort((a,z) => (rank[a.st.level] - rank[z.st.level]) || (((z.b.good - z.v)/z.b.good) - ((a.b.good - a.v)/a.b.good)));
    if (flagged.length){
      primary = flagged[0];
      let trend = "";
      if (primary.p != null && isFinite(primary.p))
        trend = primary.v < primary.p ? ` — piorou vs período anterior (era ${M.pct1(primary.p)})` : primary.v > primary.p ? ` — mas vem melhorando (era ${M.pct1(primary.p)})` : "";
      ins.push(["⛔", `<b>Maior gargalo:</b> <b>${primary.b.label}</b> em ${M.pct1(primary.v)} (${primary.st.word} — faixa boa ≥ ${M.pct1(primary.b.good)})${trend}. Foco: ${primary.b.advice}.`]);
    } else {
      ins.push(["✅", `<b>Sem gargalo claro:</b> as 3 etapas pós-clique estão dentro das faixas de mercado. Funil redondo — o ganho vem mais de escala/criativo do que de conversão.`]);
    }
  }
  if (over && cpcCeil != null)
    ins.push(traf.cpc > cpcCeil
      ? ["💸", `<b>Clique caro:</b> ${M.money(traf.cpc)} vs ${M.money(cpcCeil)} que a meta comporta. Atacar criativo/público (CPM) ou conversão da página.`]
      : ["✅", `<b>Clique saudável</b> (${M.money(traf.cpc)}). O que segura o CAC é a conversão do funil, não o preço da mídia.`]);
  const burning = ads.filter(a => a.spend >= T && (a.sales === 0 || (a.cac != null && a.cac > 2*T))).sort((a,b) => b.spend - a.spend).slice(0, 4);
  burning.forEach(a => ins.push(["🔥", `<b>Queimando verba:</b> "${escape_(a.label)}" gastou ${M.money(a.spend)} e ${a.sales === 0 ? "não vendeu" : `só ${int(a.sales)} venda(s) (CAC ${M.money(a.cac)})`} — candidato a pausar.`]));
  const promising = ads.filter(a => a.sales > 0 && a.cac != null && a.cac < T*0.8).sort((a,b) => a.cac - b.cac).slice(0, 4);
  promising.forEach(a => ins.push(["⭐", `<b>Pode surpreender:</b> "${escape_(a.label)}" CAC ${M.money(a.cac)} com ${int(a.sales)} venda(s) e só ${M.money(a.spend)} gastos — colocar mais verba e criar variações.`]));
  ins.push(["🧭", over
    ? `<b>Resumo:</b> tráfego um pouco acima da meta de CAC, mas perto. Cortar o que queima verba, escalar os campeões e destravar o gargalo deve trazer pra dentro.`
    : `<b>Resumo:</b> tráfego saudável, CAC na meta. Momento de escalar com cuidado mantendo o CAC.`]);
  const insHtml = `<div>${ins.map(i => `<div class="insight"><span class="ico">${i[0]}</span><span class="tx">${i[1]}</span></div>`).join("")}</div>`;
  brief.push({t:"Insights e gargalos", h:insHtml, x:ins.map(i => "• " + i[1].replace(/<[^>]+>/g, "")).join("\n")});

  // -- próximos passos (sugestões minhas) --
  const sug = [];
  if (scale.length) sug.push(`Subir orçamento (10–20%) nas campanhas com CAC folgado: ${scale.slice(0,3).map(c => escape_(c.label)).join(", ")}.`);
  if (cut.length) sug.push(`Cortar/pausar o que drena verba: ${cut.slice(0,3).map(c => escape_(c.label)).join(", ")}.`);
  burning.slice(0,2).forEach(a => sug.push(`Pausar o anúncio "${escape_(a.label)}" (${M.money(a.spend)} gastos, ${a.sales === 0 ? "sem venda" : "CAC " + M.money(a.cac)}).`));
  if (promising.length) sug.push(`Duplicar e criar variações dos campeões de eficiência: ${promising.slice(0,3).map(a => escape_(a.label)).join(", ")}.`);
  if (primary) sug.push(`Atacar o gargalo de ${primary.b.label} (hoje ${M.pct1(primary.v)}, faixa boa ≥ ${M.pct1(primary.b.good)}): ${primary.b.advice}.`);
  if (over && cpcCeil != null) sug.push(traf.cpc > cpcCeil
    ? `Trazer o CPC de ${M.money(traf.cpc)} pra ~${M.money(cpcCeil)} (criativo/público) ou subir a conversão pra ${M.pct1(convNeeded)}.`
    : `CPC ok — foco em conversão do funil pra ganhar folga no CAC.`);
  if (!over) sug.push(`Escalar com cuidado (horizontal costuma segurar melhor o CAC neste projeto) e monitorar CPC/conversão a cada subida.`);
  if (!sug.length) sug.push("Sem ação urgente — manter monitoramento diário do CAC.");
  brief.push({t:"Próximos passos (sugestões)", h:`<ul>${sug.map(s => `<li>${s}</li>`).join("")}</ul>`, x:sug.map(s => "• " + s.replace(/<[^>]+>/g, "")).join("\n")});

  const briefText = `BRIEFING DO GESTOR — ${DATA.meta.title}\n${perLabel}\n\n`
    + brief.map(s => s.t.toUpperCase() + "\n" + s.x).join("\n\n")
    + `\n\n— gerado pela dashboard (${DATA.meta.generated_at_br})`;

  const briefingBlock = `
    <div class="briefing">
      <div class="bh">
        <h3>🔒 Briefing do gestor <span style="font-weight:500;font-size:12px;color:var(--ink-3)">— uso interno, pra você montar rápido. Não vai no print/cliente.</span></h3>
        <button class="rep-copy" id="repCopy">📋 Copiar briefing</button>
      </div>
      ${brief.map(s => `<div class="brief-sub"><div class="bt">${s.t}</div>${s.h}</div>`).join("")}
      <div class="brief-scratch"><div class="bt" style="font-size:12px;font-weight:700;color:var(--brand);margin-bottom:6px">✍️ SUAS ANOTAÇÕES (rascunho)</div>
        <textarea data-note="scratch" rows="3" placeholder="rascunho livre pra você…"></textarea></div>
    </div>`;

  document.getElementById("reportView").innerHTML = `
    <div class="report">
      <div class="rep-head">
        <div><h2>📄 Relatório — ${escape_(perLabel)}</h2>
          <p class="sub" style="margin-top:2px">Muda sozinho conforme o período · atualizado ${DATA.meta.generated_at_br}</p></div>
      </div>
      <p class="sub" style="margin:0 0 8px">⬇️ Blocos visuais limpos (é o que você manda em print pro cliente). Seu <b style="color:var(--ink-2)">briefing interno</b> fica no final.</p>
      ${secVisual}
      ${briefingBlock}
    </div>`;

  document.querySelectorAll("#reportView [data-note]").forEach(t => {
    const k = "rep-note-" + t.dataset.note;
    try { t.value = localStorage.getItem(k) || ""; } catch(e){}
    t.oninput = () => { try { localStorage.setItem(k, t.value); } catch(e){} };
  });
  document.querySelectorAll("#reportView [data-adlink]").forEach(inp => {
    const k = "rep-adlink-" + decodeURIComponent(inp.dataset.adlink);
    try { inp.value = localStorage.getItem(k) || ""; } catch(e){}
    inp.oninput = () => { try { localStorage.setItem(k, inp.value); } catch(e){} };
  });
  document.getElementById("repCopy").onclick = e => {
    const btn = e.currentTarget;
    let scratch = ""; try { scratch = (localStorage.getItem("rep-note-scratch") || "").trim(); } catch(_){}
    const full = briefText + (scratch ? "\n\nSUAS ANOTAÇÕES\n" + scratch : "");
    navigator.clipboard.writeText(full).then(() => { btn.textContent = "✅ Copiado!"; setTimeout(() => btn.textContent = "📋 Copiar briefing", 1800); })
      .catch(() => { btn.textContent = "❌ copie manualmente"; });
  };
}
function repStat(l, v){ return `<div class="rep-stat"><div class="l">${l}</div><div class="v">${v}</div></div>`; }

/* ============================================================ shell */
function shell(){
  const m = DATA.meta;
  document.getElementById("title").textContent = m.title;
  document.getElementById("subtitle").innerHTML =
    `${escape_(m.platform)} · dados de ${dayFull(m.date_min)} a ${dayFull(m.date_max)} · ` +
    `${int(m.counts.ads_rows)} linhas de anúncio · ` +
    `<b style="color:var(--ink-2)">${int(m.counts.traffic_sales)} vendas de tráfego</b> de ${int(m.counts.sales_rows)} no total`;
  document.getElementById("updated").textContent = "atualizado " + m.generated_at_br;
  document.getElementById("taxBadge").textContent =
    m.tax === 1 ? "sem imposto" : `imposto ×${taxStr(m.tax)} aplicado`;
  document.getElementById("taxBadge").title = m.tax === 1
    ? "Nenhum imposto aplicado sobre o gasto."
    : `Gasto bruto × ${m.tax} — ${TAX_NOTE}.`;

  const at = m.counts.attribution;
  const okSales = at.ad + at.adset + at.campaign;

  document.getElementById("app").innerHTML = `
    <div class="viewtabs" role="tablist" aria-label="Visão">
      <button data-tab="total" role="tab">📊 Visão Geral</button>
      <button data-tab="traffic" role="tab">🎯 Tráfego Pago</button>
      <button data-tab="report" role="tab">📄 Relatório</button>
    </div>

    <div class="controls">
      <div class="grp">
        <label>Período</label>
        <button class="btn" data-preset="today">Hoje</button>
        <button class="btn" data-preset="yesterday">Ontem</button>
        <button class="btn" data-preset="7">7 dias</button>
        <button class="btn" data-preset="14">14 dias</button>
        <button class="btn" data-preset="30">30 dias</button>
        <button class="btn" data-preset="all">Tudo</button>
      </div>
      <div class="grp">
        <input type="date" id="from" min="${m.date_min}" max="${m.date_max}">
        <span style="color:var(--ink-3)">até</span>
        <input type="date" id="to" min="${m.date_min}" max="${m.date_max}">
      </div>
      <div class="spacer"></div>
      <div class="grp">
        <button class="btn on" id="cmp" aria-pressed="true">Comparar c/ período anterior</button>
        <span style="font-size:12px;color:var(--ink-3)" id="cmpNote"></span>
      </div>
    </div>

    <div id="dashView">
    <div class="panel"><div class="health" id="health"></div></div>

    <div class="hero" id="hero"></div>
    <p class="hero-line" id="heroLine" style="margin-bottom:10px"></p>
    <div id="trafficNote" style="display:flex;gap:9px;align-items:flex-start;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px"></div>

    <div class="grid-funnel">
      <div class="panel">
        <h2>Funil completo</h2>
        <p class="note">Investimento → Impressões → Cliques → Page views → Checkouts → Vendas.
          Cada etapa mostra o <strong>volume</strong> (bloco verde, escurecendo conforme desce) e, à direita,
          o <strong>custo</strong> e a <strong>taxa de passagem</strong> para a etapa seguinte.</p>
        <div class="goalrow">Meta de investimento: R$
          <input type="number" id="goal" min="0" step="100" placeholder="ex.: 5000" inputmode="numeric">
          <span style="opacity:.7">opcional — mostra o % do orçamento gasto</span></div>
        <div class="funnel" id="funnel"></div>
      </div>
      <div class="panel">
        <h2>Resultados por dia</h2>
        <p class="note">Barras = <b style="color:var(--ink-2)">Investimento c/ imposto</b> (eixo esq., R$) ·
          linha = <b style="color:var(--ink-2)">Vendas</b> (eixo dir., nº).</p>
        <div class="legend" id="legA"></div>
        <div id="chA"></div>
        <h2 style="margin-top:20px">Faturamento × Investimento × ROAS</h2>
        <p class="note">Barras = <b style="color:var(--ink-2)">Faturamento</b> e <b style="color:var(--ink-2)">Investimento</b> (eixo esq., R$) ·
          linha = <b style="color:var(--ink-2)">ROAS</b> (eixo dir.).</p>
        <div class="legend" id="legB"></div>
        <div id="chB"></div>
      </div>
    </div>

    <div class="panel">
      <h2 id="metricTitle">Investimento por dia</h2>
      <p class="note">Escolha a métrica; com a comparação ligada, a linha tracejada é o período anterior alinhado dia a dia.</p>
      <div class="tabs" id="metricTabs">
        ${METRICS.map(x => `<button class="btn" data-metric="${x.k}">${x.label}</button>`).join("")}
      </div>
      <div class="legend" id="legend"></div>
      <div id="chMetric"></div>
    </div>

    <div class="panel">
      <h2>Visão diária — principais métricas por dia</h2>
      <p class="note">Uma linha por dia, mais recente no topo. Heatmap por coluna: <b style="color:var(--good-text)">verde = melhor</b>,
        <b style="color:var(--critical)">vermelho = pior</b> no período — CPM, CPC e CAC quanto menores melhor; ROAS quanto maior melhor.</p>
      <div class="tblwrap"><table id="dtbl" class="daily"></table></div>
    </div>

    <div class="panel">
      <h2>Otimização — Campanha › Conjunto › Anúncio</h2>
      <p class="note">
        Clique numa <b style="color:var(--ink-1)">campanha</b> pra abrir os conjuntos, e num conjunto pra abrir os anúncios.
        Clique nos cabeçalhos pra ordenar. CAC e ROAS coloridos (verde = melhor).
        Só entram aqui as <b style="color:var(--ink-1)">vendas de tráfego (utm_source = ${escape_(m.traffic_source||"meta-ads")})</b>, agrupadas pela campanha de origem;
        as de tráfego cuja UTM não casou aparecem em “tráfego sem campanha casada”. Vendas orgânicas/diretas não entram.
      </p>
      <div class="tblwrap"><table id="tbl" class="tree"></table></div>
    </div>

    ${(m.warnings||[]).map(w => `<div class="warn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--warning)" stroke-width="1.6"><path d="M8 1.8 15 14H1L8 1.8Z" stroke-linejoin="round"/><path d="M8 6.2v3.4M8 11.8v.05" stroke-linecap="round"/></svg><span>${escape_(w)}</span></div>`).join("")}
    </div>

    <div id="reportView" hidden></div>

    <footer>
      Gasto bruto do período completo: ${money(DATA.ads.reduce((s,r)=>s+r.spend,0))} ·
      com imposto ×${taxStr(m.tax)}: ${money(DATA.ads.reduce((s,r)=>s+r.spend,0)*m.tax)}.
      ${TAX_NOTE[0].toUpperCase()+TAX_NOTE.slice(1)}.<br>
      Vendas atribuídas por UTM → hierarquia do Meta: ${at.ad} no anúncio, ${at.adset} até o conjunto,
      ${at.campaign} até a campanha, ${at.unmatched} com UTM desconhecida, ${at.none} sem UTM.
      A venda entra no dia em que foi paga, não no dia do clique.<br>
      Fontes (somente leitura):
      <a href="${m.ads_url}" target="_blank" rel="noopener">planilha de anúncios</a> ·
      <a href="${m.sales_url}" target="_blank" rel="noopener">planilha de vendas</a> (aba ${escape_(m.sales_tab)}).
      Build ${BUILD_ID}.
    </footer>`;

  // --- listeners ---
  document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
    const p = b.dataset.preset;
    if (p === "all")   return setPeriod(m.date_min, m.date_max, "all");
    if (p === "today") return setPeriod(m.date_max, m.date_max, "today");
    if (p === "yesterday"){ const y = addDays(m.date_max, -1); const f = y < m.date_min ? m.date_min : y; return setPeriod(f, f, "yesterday"); }
    const n = +p;
    const from = addDays(m.date_max, -(n-1));
    setPeriod(from < m.date_min ? m.date_min : from, m.date_max, p);
  });
  const clampDates = () => {
    let f = document.getElementById("from").value, t = document.getElementById("to").value;
    if (!f || !t) return;
    if (f > t) [f,t] = [t,f];
    setPeriod(f, t, "custom");
  };
  document.getElementById("from").onchange = clampDates;
  document.getElementById("to").onchange = clampDates;

  document.getElementById("cmp").onclick = e => {
    STATE.compare = !STATE.compare;
    e.currentTarget.classList.toggle("on", STATE.compare);
    e.currentTarget.setAttribute("aria-pressed", STATE.compare);
    render();
  };
  document.querySelectorAll("[data-metric]").forEach(b => b.onclick = () => {
    STATE.metric = b.dataset.metric;
    document.querySelectorAll("[data-metric]").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelector('[data-metric="spend"]').classList.add("on");

  // meta de investimento (guardada no navegador)
  const goalInput = document.getElementById("goal");
  try { const g = localStorage.getItem("funnel-goal"); if (g){ STATE.goal = +g; goalInput.value = g; } } catch(e){}
  goalInput.oninput = () => {
    const v = parseFloat(goalInput.value);
    STATE.goal = isFinite(v) && v > 0 ? v : null;
    try { STATE.goal ? localStorage.setItem("funnel-goal", STATE.goal) : localStorage.removeItem("funnel-goal"); } catch(e){}
    renderFunnel(aggregate(STATE.from, STATE.to));
  };

  // abas: Visão Geral (todas) · Tráfego Pago (meta-ads) · Relatório
  try { const tv = localStorage.getItem("funnel-tab"); if (["total","traffic","report"].includes(tv)) STATE.tab = tv; } catch(e){}
  if (STATE.tab !== "report") STATE.mode = STATE.tab;
  document.querySelectorAll("[data-tab]").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.tab === STATE.tab);
    b.onclick = () => {
      STATE.tab = b.dataset.tab;
      if (STATE.tab !== "report") STATE.mode = STATE.tab;
      try { localStorage.setItem("funnel-tab", STATE.tab); } catch(e){}
      document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === STATE.tab));
      refresh();
    };
  });

  setPeriod(m.date_min, m.date_max, "all");
}

/* ============================================================ boot */
async function load(){
  // Cache-bust duplo: o id do build invalida entre deploys, o timestamp
  // impede que um proxy sirva algo velho dentro do mesmo build.
  const url = `data.json?v=${BUILD_ID}&t=${Date.now()}`;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(`data.json respondeu ${r.status}`);
  DATA = await r.json();
  shell();
}

const applyTheme = t => {
  document.documentElement.dataset.theme = t;
  document.getElementById("theme").textContent = t === "dark" ? "Claro" : "Escuro";
  try { localStorage.setItem("funnel-theme", t); } catch(e){}
};
document.getElementById("theme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
try {
  const saved = localStorage.getItem("funnel-theme");
  applyTheme(saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
} catch(e){ applyTheme("dark"); }

document.getElementById("reload").onclick = () => location.reload();

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (DATA) render(); }, 180); });

load().catch(e => {
  document.getElementById("app").innerHTML =
    `<div class="panel err"><h2>Não consegui carregar os dados</h2>
     <p class="note" style="margin:8px 0 0">${escape_(e.message)}. Verifique se o build do GitHub Actions rodou sem erro.</p></div>`;
});
</script>
</body>
</html>
