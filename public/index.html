<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CPGD-AGO26 — Funil de Tráfego (Meta Ads)</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f2f2ef; --card:#ffffff;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --brand:#4e9a00; --brand-ink:#ffffff; --brand-soft:rgba(78,154,0,.12);
  --series-1:#4e9a00; --series-2:#1f7fb8; --series-3:#1f7fb8;
  --good:#0ca30c; --good-text:#006300; --warning:#fab219; --critical:#d03b3b;
  --f1:#8fca2e; --f2:#6fae16; --f3:#55930c; --f4:#3f6f08; --f5:#2c5106;
  --scale-ink:#4e9a00;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px -12px rgba(11,11,11,.18);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#16171a; --plane:#0b0c0a; --card:#16171a;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2a2c26; --axis:#383a33; --ring:rgba(255,255,255,.10);
  --brand:#8fe01e; --brand-ink:#0c1400; --brand-soft:rgba(143,224,30,.14);
  --series-1:#8fe01e; --series-2:#41b2e2; --series-3:#41b2e2;
  --good:#0ca30c; --good-text:#8fe01e; --warning:#fab219; --critical:#e2555a;
  --f1:#e2f7ad; --f2:#bfee66; --f3:#8fe01e; --f4:#5aa614; --f5:#3c7810;
  --scale-ink:#8fe01e;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 26px -12px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink-1);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;padding:24px 20px 72px}

/* ---------------------------------------------------------------- header */
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;color:var(--ink-2)}
.sub{color:var(--ink-3);font-size:13px;margin:0}

/* marca Best-Seller de Verdade (recriação vetorial — trocável pelo PNG real) */
.brandlock{display:inline-flex;flex-direction:column;gap:9px;margin-bottom:14px}
.mc-pill{align-self:flex-start;border:1.5px solid var(--brand);color:var(--brand);
  font-size:9px;font-weight:700;letter-spacing:.3em;padding:3px 9px 3px 11px;border-radius:999px;
  text-transform:uppercase;line-height:1}
.wordmark{position:relative;display:inline-block;font-weight:800;line-height:.9;
  font-size:30px;letter-spacing:-.005em;color:var(--ink-1);text-transform:uppercase;
  transform:scaleX(.88);transform-origin:left}
.wordmark .hy{color:var(--brand)}
.wordmark .ul{display:block;width:52px;height:8px;background:var(--brand);margin-top:8px;border-radius:1px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--ring);background:var(--card);color:var(--ink-2);
  font-size:12px;font-weight:550;white-space:nowrap;
}
.badge.tax{color:var(--ink-1);border-color:color-mix(in srgb,var(--brand) 55%,transparent);background:var(--brand-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none;box-shadow:0 0 6px var(--brand)}

button,select,input{font:inherit;color:inherit}
.btn{
  appearance:none;border:1px solid var(--ring);background:var(--card);color:var(--ink-2);
  border-radius:8px;padding:6px 11px;font-size:13px;font-weight:550;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
.btn:hover{background:var(--plane);color:var(--ink-1)}
.btn[aria-pressed="true"],.btn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:650}

/* abas de visão: Geral × Tráfego Pago */
.viewtabs{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:4px;margin-bottom:16px;box-shadow:var(--shadow)}
.viewtabs button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,color .12s;white-space:nowrap}
.viewtabs button:hover{color:var(--ink-1)}
.viewtabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}

/* relatório */
.report{max-width:940px;margin:0 auto}
.rep-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.rep-head h2{font-size:20px;font-weight:680;margin:0;letter-spacing:-.01em}
.rep-sec{background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.rep-sec .step{font-size:10.5px;font-weight:700;color:var(--brand);letter-spacing:.08em;margin-bottom:3px}
.rep-sec h3{font-size:15.5px;font-weight:660;margin:0 0 2px}
.rep-p{font-size:14px;line-height:1.6;color:var(--ink-1);margin:12px 0 0}
.rep-p.muted{color:var(--ink-2);font-size:13px;margin-top:4px}
.rep-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0 2px}
.rep-stat{background:var(--plane);border-radius:10px;padding:10px 12px}
.rep-stat .l{font-size:10.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.rep-stat .v{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:3px;font-variant-numeric:tabular-nums}
.rep-note{margin-top:12px}
.rep-note label{font-size:12px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:5px}
.rep-note textarea{width:100%;background:var(--plane);border:1px solid var(--ring);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink-1);resize:vertical;min-height:58px}
.rep-ad{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--grid)}
.rep-ad:last-of-type{border-bottom:0}
.rep-ad .nm{font-weight:650;font-size:14px}
.rep-ad .mt{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rep-ad input{flex:1 1 220px;min-width:150px;background:var(--plane);border:1px solid var(--ring);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;color:var(--ink-1)}
.insight{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--grid)}
.insight:last-child{border-bottom:0}
.insight .ico{font-size:16px;flex:none;line-height:1.5}
.insight .tx{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.insight .tx b{color:var(--ink-1)}
.rep-copy{appearance:none;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:650;font-size:13px;padding:9px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.rep-copy:hover{filter:brightness(1.06)}
/* briefing interno do gestor */
.briefing{background:var(--brand-soft);border:1.5px dashed color-mix(in srgb,var(--brand) 55%,transparent);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.briefing .bh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.briefing .bh h3{margin:0;font-size:15.5px;font-weight:680}
.brief-sub{margin-top:16px}
.brief-sub .bt{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.brief-sub p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-1)}
.brief-sub ul{margin:6px 0 0;padding-left:18px}
.brief-sub li{font-size:13.5px;line-height:1.55;color:var(--ink-1);margin:5px 0}
.brief-scratch{margin-top:16px}
.brief-scratch textarea{width:100%;background:var(--card);border:1px solid var(--ring);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink-1);resize:vertical;min-height:56px}
.rep-flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:6px}
.rep-flag.g{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good-text)}
.rep-flag.r{background:color-mix(in srgb,var(--critical) 22%,transparent);color:var(--critical)}
.rep-flag.y{background:color-mix(in srgb,var(--warning) 24%,transparent);color:var(--warning)}

/* ---------------------------------------------------------------- filtros */
.controls{
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  background:var(--card);border:1px solid var(--ring);border-radius:14px;
  padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow);
}
.controls .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.controls label{font-size:12px;color:var(--ink-3);font-weight:550;text-transform:uppercase;letter-spacing:.04em}
.controls input[type=date]{
  background:var(--plane);border:1px solid var(--ring);border-radius:8px;padding:5px 8px;font-size:13px;
}
.spacer{flex:1 1 auto}

/* ---------------------------------------------------------------- cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:14px}
.kpi{
  background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:14px 15px;
  box-shadow:var(--shadow);min-width:0;
}
.kpi .k{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:5px;margin-bottom:7px}
.kpi .v{font-size:25px;font-weight:640;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:6px;display:flex;align-items:center;gap:5px;min-height:18px}
.up{color:var(--good-text);font-weight:600}
.down{color:var(--critical);font-weight:600}
.flat{color:var(--ink-3);font-weight:600}

/* ---------------------------------------------------------------- painel */
.panel{
  background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:16px 18px 18px;
  box-shadow:var(--shadow);margin-bottom:14px;min-width:0;
}
.panel h2{font-size:14px;font-weight:640;margin:0 0 2px;letter-spacing:-.005em}
.panel .note{font-size:12px;color:var(--ink-3);margin:0 0 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid-funnel{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.grid2,.grid-funnel{grid-template-columns:minmax(0,1fr)}}

/* ---------------------------------------------------------------- funil (cards divididos) */
.funnel{display:flex;flex-direction:column;gap:8px}
.fstage{display:grid;grid-template-columns:1.15fr 1fr;border:1px solid var(--ring);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.fstage .fl{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:76px}
.fstage .fl .fn{font-size:12.5px;font-weight:600;line-height:1.1;opacity:.92}
.fstage .fl .fv{font-size:24px;font-weight:760;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.fstage .fr{padding:11px 15px;background:var(--card);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.fstage .fr .cl{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.fstage .fr .cv{font-size:19px;font-weight:700;color:var(--brand);letter-spacing:-.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.fstage .fr .fsub{font-size:12px;color:var(--ink-3);line-height:1.35}
.fstage .fr .fsub b{color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:650}
.fstage .fgoal{height:8px;border-radius:5px;background:color-mix(in srgb,var(--ink-3) 22%,transparent);overflow:hidden;margin-top:7px}
.fstage .fgoal i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .4s}
@media (max-width:520px){.fstage{grid-template-columns:1fr}}

/* ---------------------------------------------------------------- charts */
.chart{width:100%;display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--ink-3);font-size:11px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.chart text.lbl{fill:var(--ink-2);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .cross{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 3;pointer-events:none;opacity:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.legend i.dash{height:0;border-top:2px dashed currentColor;border-radius:0;width:14px}

#tip{
  position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--card);border:1px solid var(--ring);border-radius:10px;padding:9px 11px;
  box-shadow:var(--shadow);font-size:12.5px;color:var(--ink-1);max-width:280px;
}
#tip b{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:5px}
#tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between;gap:16px}
#tip .r em{font-style:normal;color:var(--ink-2);display:flex;align-items:center;gap:6px}
#tip .r strong{font-variant-numeric:tabular-nums;font-weight:620}
#tip i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* ---------------------------------------------------------------- tabelas */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tblwrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:1080px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:270px;max-width:420px}
thead th{
  font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.045em;font-weight:650;
  cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card);z-index:2;
  border-bottom:1px solid var(--axis);
}
thead th:hover{color:var(--ink-1)}
thead th .arw{opacity:.35;font-size:9px;margin-left:3px}
thead th[data-active] .arw{opacity:1;color:var(--series-1)}
tbody td{font-variant-numeric:tabular-nums;color:var(--ink-2)}
tbody td:first-child{color:var(--ink-1);font-weight:550;line-height:1.35}
tbody tr:hover td{background:color-mix(in srgb,var(--series-1) 6%,transparent)}
tfoot td{font-weight:650;color:var(--ink-1);border-top:1px solid var(--axis);border-bottom:none;
  position:sticky;bottom:0;background:var(--card)}
.cell-scale{border-radius:5px;padding:3px 7px;display:inline-block;min-width:62px;text-align:right}
.muted-row td{opacity:.62;font-style:italic}

/* ---------------------------------------------------------------- saúde geral */
.health{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:760px){.health{grid-template-columns:1fr}}
.gauge{position:relative;width:132px;height:132px;flex:none;margin:2px auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.gauge .gv b{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.gauge .gv span{font-size:11px;color:var(--ink-3)}
.health-head{font-size:15px;font-weight:640;margin:0 0 3px}
.health-head .tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.health-sub{font-size:12.5px;color:var(--ink-2);margin:0 0 14px}
.hbars{display:grid;grid-template-columns:1fr 1fr;gap:11px 26px}
@media (max-width:620px){.hbars{grid-template-columns:1fr}}
.hbar .hb-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .hb-top em{font-style:normal;color:var(--ink-2)}
.hbar .hb-top strong{font-variant-numeric:tabular-nums;font-weight:640;color:var(--ink-1)}
.hbar .hb-track{height:7px;border-radius:4px;background:var(--plane);overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ---------------------------------------------------------------- hero invest→receita→roas */
.hero{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin-bottom:6px}
@media (max-width:1040px){.hero{grid-template-columns:1fr 1fr;gap:8px}.hero .op{display:none}}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.hero .hcard{background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .hcard.roas{border-top:3px solid var(--brand)}
.hero .hk{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.hero .hk small{font-weight:500;color:var(--ink-3)}
.hero .hv{font-size:29px;font-weight:680;letter-spacing:-.02em;line-height:1}
.hero .hv.g{color:var(--good-text)}
.hero .hd{font-size:12.5px;margin-top:7px}
.hero .op{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-3);font-weight:400}
.hero-line{font-size:13px;color:var(--ink-2);margin:2px 0 0}
.hero-line b{color:var(--brand)}
.ratebar{height:8px;border-radius:5px;background:var(--plane);overflow:hidden;margin:10px 0 4px;display:flex}
.ratebar i{display:block;height:100%}

/* ---------------------------------------------------------------- meta de investimento */
.goalrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin:2px 0 10px;flex-wrap:wrap}
.goalrow input{width:100px;background:var(--plane);border:1px solid var(--ring);border-radius:7px;padding:4px 7px;font-size:13px;color:var(--ink-1)}
.goalbar{height:9px;border-radius:5px;background:var(--plane);overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .4s}

/* ---------------------------------------------------------------- árvore campanha/conjunto/anúncio */
.tree td:first-child{padding-left:10px}
.tree .lv1 td:first-child{padding-left:34px}
.tree .lv2 td:first-child{padding-left:60px}
.tree tr.exp>td:first-child{cursor:pointer}
.tree tr.exp:hover>td:first-child{color:var(--brand)}
.tree .caret{display:inline-block;width:14px;color:var(--ink-3);transition:transform .15s;font-size:10px}
.tree tr.open>td:first-child .caret{transform:rotate(90deg);color:var(--brand)}
.tree .lv1 td{background:color-mix(in srgb,var(--ink-3) 4%,transparent)}
.tree .lv2 td{background:color-mix(in srgb,var(--ink-3) 8%,transparent);font-size:12.5px}
.tree .nm{white-space:normal;line-height:1.3}
.tree .lv0 .nm{font-weight:600}
.tree .lv1 .nm,.tree .lv2 .nm{font-weight:450;color:var(--ink-2)}

/* ---------------------------------------------------------------- rodape */
.warn{
  display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--warning) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 38%,transparent);
  border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-bottom:9px;
}
.warn svg{flex:none;margin-top:1px}
footer{color:var(--ink-3);font-size:12px;margin-top:22px;line-height:1.7}
footer a{color:var(--series-1)}
.loading{padding:80px 0;text-align:center;color:var(--ink-3)}
.err{border-color:color-mix(in srgb,var(--critical) 45%,transparent);
  background:color-mix(in srgb,var(--critical) 10%,transparent)}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brandlock" aria-label="Best-Seller de Verdade — MasterClass">
        <span class="mc-pill">Masterclass</span>
        <div class="wordmark">Best<span class="hy">-</span>Seller<br>de Verdade<span class="ul"></span></div>
      </div>
      <h1 id="title">Funil de Tráfego</h1>
      <p class="sub" id="subtitle">carregando…</p>
    </div>
    <div class="top-right">
      <span class="badge tax" id="taxBadge" title="Imposto obrigatório do Meta Ads aplicado sobre o gasto bruto">imposto —</span>
      <span class="badge"><span class="dot"></span><span id="updated">—</span></span>
      <button class="btn" id="reload" title="Buscar a última versão dos dados">Atualizar</button>
      <button class="btn" id="theme" title="Alternar tema claro/escuro">Claro</button>
    </div>
  </header>

  <div id="app"><div class="loading">Carregando dados…</div></div>
</div>

<div id="tip" role="tooltip"></div>

<script>
"use strict";
const BUILD_ID = "20260804210247";
const TAX_NOTE = "todas as métricas usam o gasto COM imposto";

/* ============================================================ formatação */
const nfInt   = new Intl.NumberFormat("pt-BR", {maximumFractionDigits:0});
const nf1     = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:1, maximumFractionDigits:1});
const nf2     = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const nfTax   = new Intl.NumberFormat("pt-BR", {maximumFractionDigits:4});
const money   = v => (v < 0 ? "−R$ " : "R$ ") + nf2.format(Math.abs(v||0));
const money0  = v => (v < 0 ? "−R$ " : "R$ ") + nfInt.format(Math.abs(v||0));
const taxStr  = v => nfTax.format(v||1);
const pct     = v => nf2.format((v||0)*100) + "%";
const pct1    = v => nf1.format((v||0)*100) + "%";
const int     = v => nfInt.format(Math.round(v||0));
const x2      = v => nf2.format(v||0) + "x";
const dash    = f => v => (v===null || v===undefined || !isFinite(v)) ? "—" : f(v);

const M  = {money:dash(money), money0:dash(money0), pct:dash(pct), pct1:dash(pct1),
            int:dash(int), x:dash(x2), n2:dash(v=>nf2.format(v))};

const dayBR   = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}`; };
const dayFull = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const addDays = (iso,n) => { const d = new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diffDays= (a,b) => Math.round((new Date(b+"T12:00:00Z") - new Date(a+"T12:00:00Z"))/864e5);
const escape_ = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================ estado */
let DATA = null;
let STATE = {from:null, to:null, compare:true, metric:"spend", mode:"traffic", tab:"traffic",
             treeSort:{key:"spend", dir:-1}, expanded:new Set(), goal:null, preset:"all"};

/* ============================================================ métricas
   Regra única do projeto: gasto = gasto bruto x imposto. Toda métrica derivada
   abaixo consome `spend`, então nenhuma delas pode escapar do imposto.        */
function blank(){
  return {spend:0, gross:0, imp:0, clk:0, lpv:0, ic:0, sales:0, rev:0};
}
function accAd(t, r, tax){
  t.gross += r.spend; t.spend += r.spend * tax;
  t.imp += r.imp; t.clk += r.clk; t.lpv += r.lpv; t.ic += r.ic;
}
function accSale(t, s){ t.sales += 1; t.rev += s.v; }

const div = (a,b) => (b > 0 ? a/b : null);

function derive(t){
  return Object.assign({}, t, {
    cpm:  div(t.spend*1000, t.imp),
    ctr:  div(t.clk, t.imp),
    cpc:  div(t.spend, t.clk),
    cpl:  div(t.spend, t.lpv),
    cpic: div(t.spend, t.ic),
    cac:  div(t.spend, t.sales),
    conv: div(t.sales, t.clk),
    cr:       div(t.lpv, t.clk),      // CR: page views / cliques
    lpCheck:  div(t.ic, t.lpv),       // LP → checkout: checkouts / page views
    convCheck:div(t.sales, t.ic),     // conversão checkout: vendas / checkouts
    convLpv:  div(t.sales, t.lpv),    // conversão LP: vendas / page views
    roas: div(t.rev, t.spend),
    ticket: div(t.rev, t.sales),
    lucro: t.rev - t.spend
  });
}

/* Venda de tráfego pago = utm_source igual ao configurado (ex.: "meta-ads").
   Só essas entram no funil / CAC / ROAS; o resto é orgânico/direto (referência). */
function isTraffic(s){
  const want = String((DATA.meta && DATA.meta.traffic_source) || "meta-ads").trim().toLowerCase();
  return String(s.src || "").trim().toLowerCase() === want;
}
/* Aba "Visão Geral" (total) = todas as vendas; "Tráfego Pago" = só meta-ads. */
const saleInScope = s => STATE.mode === "total" ? true : isTraffic(s);

function aggregate(from, to){
  const tax = DATA.meta.tax, t = blank();
  for (const r of DATA.ads) if (r.d >= from && r.d <= to) accAd(t, r, tax);
  let allSales = 0, allRev = 0, trafSales = 0, trafRev = 0;
  for (const s of DATA.sales) if (s.d >= from && s.d <= to){
    allSales++; allRev += s.v;
    if (isTraffic(s)){ trafSales++; trafRev += s.v; }
    if (saleInScope(s)) accSale(t, s);       // a aba ativa decide o que entra nas métricas
  }
  const d = derive(t);
  d.allSales = allSales;   d.allRev = allRev;          // total (tráfego + orgânico)
  d.trafSales = trafSales; d.trafRev = trafRev;        // só tráfego pago
  d.orgSales = allSales - trafSales; d.orgRev = allRev - trafRev;  // fora do tráfego
  return d;
}

/* Nas tabelas de otimização entram só vendas DE TRÁFEGO ligadas a uma campanha. */
const attributed = s => isTraffic(s) && (s.m === "ad" || s.m === "adset" || s.m === "campaign");

function groupBy(level, from, to){
  const tax = DATA.meta.tax, map = new Map();
  const keyOf = o => level === "campaign" ? o.c : level === "adset" ? o.c + " ▸ " + o.s : o.c + " ▸ " + o.s + " ▸ " + o.a;
  const labelOf = o => level === "campaign" ? o.c : level === "adset" ? o.s : o.a;
  const parentOf = o => level === "campaign" ? "" : level === "adset" ? o.c : o.c + "  ▸  " + o.s;

  const touch = o => {
    const k = keyOf(o);
    if (!map.has(k)) map.set(k, Object.assign(blank(), {key:k, label:labelOf(o), parent:parentOf(o)}));
    return map.get(k);
  };
  for (const r of DATA.ads) if (r.d >= from && r.d <= to) accAd(touch(r), r, tax);
  for (const s of DATA.sales) if (s.d >= from && s.d <= to && attributed(s)) accSale(touch(s), s);
  return [...map.values()].map(derive);
}

function daily(from, to){
  const tax = DATA.meta.tax, map = new Map();
  for (let d = from; d <= to; d = addDays(d,1)) map.set(d, Object.assign(blank(), {d}));
  for (const r of DATA.ads) if (map.has(r.d)) accAd(map.get(r.d), r, tax);
  for (const s of DATA.sales) if (map.has(s.d) && saleInScope(s)) accSale(map.get(s.d), s);
  return [...map.values()].map(derive);
}

/* ============================================================ SVG helpers */
const NS = "http://www.w3.org/2000/svg";
const el = (n, at={}) => { const e = document.createElementNS(NS,n); for (const k in at) e.setAttribute(k, at[k]); return e; };

/** Escala "bonita": topo arredondado para 1/2/5 x 10^n. */
function niceMax(v){
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v/e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function ticks(max, n=4){
  const out = [];
  for (let i = 0; i <= n; i++) out.push(max*i/n);
  return out;
}
/** Densidade de rótulos do eixo x: nunca deixa os dias se atropelarem. */
function labelStep(count, width){ return Math.max(1, Math.ceil(count / Math.max(2, Math.floor(width/58)))); }

const TIP = document.getElementById("tip");
function showTip(html, ev){
  TIP.innerHTML = html; TIP.style.opacity = 1;
  const r = TIP.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y < 8) y = ev.clientY + 18;
  TIP.style.left = x + "px"; TIP.style.top = y + "px";
}
const hideTip = () => { TIP.style.opacity = 0; };

/**
 * Gráfico de barras diário. Uma série só — a identidade vem do título, então
 * não leva legenda (a regra da legenda começa em 2 séries).
 */
function barChart(host, rows, key, color, fmt, tipLabel){
  host.innerHTML = "";
  const W = Math.max(320, host.clientWidth || 520), H = 208;
  const P = {t:14, r:10, b:26, l:56};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const svg = el("svg", {class:"chart", viewBox:`0 0 ${W} ${H}`, width:"100%", height:H, role:"img"});

  const max = niceMax(Math.max(...rows.map(r => r[key] || 0), 0));
  const y = v => P.t + ih - (max > 0 ? (v/max)*ih : 0);

  for (const t of ticks(max)){
    svg.appendChild(el("line", {class:"gl", x1:P.l, x2:P.l+iw, y1:y(t), y2:y(t)}));
    const tx = el("text", {x:P.l-8, y:y(t)+4, "text-anchor":"end"});
    tx.textContent = fmt(t); svg.appendChild(tx);
  }
  svg.appendChild(el("line", {class:"ax", x1:P.l, x2:P.l+iw, y1:P.t+ih, y2:P.t+ih}));

  const slot = iw/Math.max(1, rows.length);
  const bw = Math.max(3, Math.min(46, slot - (rows.length > 40 ? 1 : 2)));  // gap de 2px entre barras
  const step = labelStep(rows.length, iw);

  rows.forEach((r,i) => {
    const cx = P.l + slot*i + slot/2;
    const v = r[key] || 0, h = Math.max(v > 0 ? 2 : 0, P.t + ih - y(v));
    if (h > 0){
      const bar = el("rect", {x:cx-bw/2, y:P.t+ih-h, width:bw, height:h, fill:color, rx:Math.min(4,bw/2)});
      svg.appendChild(bar);
    }
    if (i % step === 0 || i === rows.length-1){
      const tx = el("text", {x:cx, y:H-8, "text-anchor":"middle"});
      tx.textContent = dayBR(r.d); svg.appendChild(tx);
    }
    const hit = el("rect", {class:"hit", x:P.l+slot*i, y:P.t, width:slot, height:ih});
    hit.addEventListener("mousemove", ev => showTip(
      `<b>${dayFull(r.d)}</b><div class="r"><em><i style="background:${color}"></i>${tipLabel}</em><strong>${fmt(v)}</strong></div>`, ev));
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

/**
 * Gráfico de linhas com crosshair. Recebe 1 ou 2 séries (atual / anterior);
 * com 2, a legenda acima é obrigatória e a série anterior vai tracejada — a
 * identidade nunca depende só da cor.
 */
function lineChart(host, labels, series, fmt){
  host.innerHTML = "";
  const W = Math.max(320, host.clientWidth || 900), H = 260;
  const P = {t:16, r:14, b:28, l:64};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const svg = el("svg", {class:"chart", viewBox:`0 0 ${W} ${H}`, width:"100%", height:H, role:"img"});

  const all = series.flatMap(s => s.values.filter(v => v !== null && isFinite(v)));
  const max = niceMax(Math.max(...all, 0));
  const n = labels.length;
  const x = i => n === 1 ? P.l + iw/2 : P.l + (iw*i)/(n-1);
  const y = v => P.t + ih - (max > 0 ? (v/max)*ih : 0);

  for (const t of ticks(max)){
    svg.appendChild(el("line", {class:"gl", x1:P.l, x2:P.l+iw, y1:y(t), y2:y(t)}));
    const tx = el("text", {x:P.l-8, y:y(t)+4, "text-anchor":"end"});
    tx.textContent = fmt(t); svg.appendChild(tx);
  }
  svg.appendChild(el("line", {class:"ax", x1:P.l, x2:P.l+iw, y1:P.t+ih, y2:P.t+ih}));

  const step = labelStep(n, iw);
  labels.forEach((lb,i) => {
    if (i % step === 0 || i === n-1){
      const tx = el("text", {x:x(i), y:H-8, "text-anchor":"middle"});
      tx.textContent = lb; svg.appendChild(tx);
    }
  });

  series.forEach(s => {
    const pts = s.values.map((v,i) => [x(i), y(v||0)]);
    const d = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const path = el("path", {d, fill:"none", stroke:s.color, "stroke-width":2,
      "stroke-linejoin":"round", "stroke-linecap":"round"});
    if (s.dashed) path.setAttribute("stroke-dasharray", "5 4");
    svg.appendChild(path);
    // anel de 2px na cor da superfície onde as séries se cruzam
    if (n <= 40) pts.forEach(p => {
      svg.appendChild(el("circle", {cx:p[0], cy:p[1], r:4, fill:s.color,
        stroke:"var(--card)", "stroke-width":2}));
    });
  });

  const cross = el("line", {class:"cross", y1:P.t, y2:P.t+ih});
  svg.appendChild(cross);
  const hit = el("rect", {class:"hit", x:P.l-4, y:P.t, width:iw+8, height:ih});
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const rel = ((ev.clientX - box.left)/box.width)*W;
    const i = Math.max(0, Math.min(n-1, Math.round(n === 1 ? 0 : ((rel-P.l)/iw)*(n-1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.style.opacity = 1;
    showTip(`<b>${series[0].fullLabels ? series[0].fullLabels[i] : labels[i]}</b>` +
      series.map(s => `<div class="r"><em><i style="background:${s.color}"></i>${s.name}</em>` +
        `<strong>${fmt(s.values[i])}</strong></div>` +
        (s.fullLabels && s !== series[0] && s.fullLabels[i] ? `<div class="r"><em style="font-size:11px;opacity:.7">${s.fullLabels[i]}</em></div>` : "")).join(""), ev);
  });
  hit.addEventListener("mouseleave", () => { cross.style.opacity = 0; hideTip(); });
  svg.appendChild(hit);
  host.appendChild(svg);
}

/**
 * Gráfico combinado barra + linha com EIXO DUPLO (esquerda = barras, direita = linha).
 * Usado a pedido, no formato da dash de referência. Eixo duplo pode induzir a leitura
 * (a posição relativa barra×linha depende das escalas), por isso cada eixo é rotulado
 * e o tooltip traz os valores exatos.
 */
function comboChart(host, rows, cfg){
  host.innerHTML = "";
  const W = Math.max(300, host.clientWidth || 520), H = 240;
  const P = {t:22, r:50, b:28, l:56};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const svg = el("svg", {class:"chart", viewBox:`0 0 ${W} ${H}`, width:"100%", height:H, role:"img"});
  const n = rows.length;

  const leftMax  = niceMax(Math.max(...rows.flatMap(r => cfg.bars.map(b => r[b.key] || 0)), 0));
  const rightMax = niceMax(Math.max(...rows.map(r => r[cfg.line.key]).filter(v => v !== null && isFinite(v)), 0));
  const yL = v => P.t + ih - (leftMax  > 0 ? (v/leftMax)  * ih : 0);
  const yR = v => P.t + ih - (rightMax > 0 ? (v/rightMax) * ih : 0);

  for (const t of ticks(leftMax)){
    svg.appendChild(el("line", {class:"gl", x1:P.l, x2:P.l+iw, y1:yL(t), y2:yL(t)}));
    const tx = el("text", {x:P.l-7, y:yL(t)+4, "text-anchor":"end"}); tx.textContent = cfg.leftFmt(t); svg.appendChild(tx);
  }
  for (const t of ticks(rightMax)){
    const tx = el("text", {x:P.l+iw+7, y:yR(t)+4, "text-anchor":"start"}); tx.textContent = cfg.rightFmt(t); svg.appendChild(tx);
  }
  svg.appendChild(el("line", {class:"ax", x1:P.l, x2:P.l+iw, y1:P.t+ih, y2:P.t+ih}));

  const slot = iw/Math.max(1, n);
  const nb = cfg.bars.length;
  const groupW = Math.min(slot - 3, nb > 1 ? 40 : 30);
  const bw = Math.max(2, groupW/nb - 1);
  const step = labelStep(n, iw);

  rows.forEach((r,i) => {
    const cx = P.l + slot*i + slot/2;
    cfg.bars.forEach((b,bi) => {
      const v = r[b.key] || 0, h = Math.max(v > 0 ? 1.5 : 0, P.t + ih - yL(v));
      const x = cx - groupW/2 + bi*(groupW/nb) + (groupW/nb - bw)/2;
      if (h > 0) svg.appendChild(el("rect", {x, y:P.t+ih-h, width:bw, height:h, fill:b.color, rx:Math.min(3,bw/2)}));
    });
    if (i % step === 0 || i === n-1){ const tx = el("text", {x:cx, y:H-8, "text-anchor":"middle"}); tx.textContent = dayBR(r.d); svg.appendChild(tx); }
  });

  // linha (eixo direito) — quebra em segmentos onde não há valor
  const pts = rows.map((r,i) => { const v = r[cfg.line.key]; return (v === null || !isFinite(v)) ? null : [P.l+slot*i+slot/2, yR(v), v]; });
  let seg = []; const segs = [];
  pts.forEach(p => { if (p) seg.push(p); else if (seg.length){ segs.push(seg); seg = []; } }); if (seg.length) segs.push(seg);
  segs.forEach(s => {
    const d = s.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    svg.appendChild(el("path", {d, fill:"none", stroke:cfg.line.color, "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round"}));
  });
  if (n <= 45) pts.forEach(p => { if (p) svg.appendChild(el("circle", {cx:p[0], cy:p[1], r:3.2, fill:cfg.line.color, stroke:"var(--card)", "stroke-width":1.5})); });

  if (cfg.labelLine && n <= 20) pts.forEach(p => { if (p){ const tx = el("text", {x:p[0], y:p[1]-7, "text-anchor":"middle", class:"lbl"}); tx.textContent = cfg.lineFmt(p[2]); svg.appendChild(tx); } });
  if (cfg.labelBars && nb === 1 && n <= 14) rows.forEach((r,i) => {
    const v = r[cfg.bars[0].key] || 0;
    if (v > 0){ const tx = el("text", {x:P.l+slot*i+slot/2, y:yL(v)-5, "text-anchor":"middle"}); tx.setAttribute("font-size","9"); tx.textContent = cfg.leftFmt(v); svg.appendChild(tx); }
  });

  const cross = el("line", {class:"cross", y1:P.t, y2:P.t+ih}); svg.appendChild(cross);
  const hit = el("rect", {class:"hit", x:P.l, y:P.t, width:iw, height:ih});
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n-1, Math.floor((((ev.clientX-box.left)/box.width)*W - P.l)/slot)));
    const r = rows[i], cx = P.l + slot*i + slot/2;
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.style.opacity = 1;
    let html = `<b>${dayFull(r.d)}</b>`;
    cfg.bars.forEach(b => html += `<div class="r"><em><i style="background:${b.color}"></i>${b.name}</em><strong>${cfg.leftFmt(r[b.key]||0)}</strong></div>`);
    html += `<div class="r"><em><i style="background:${cfg.line.color}"></i>${cfg.line.name}</em><strong>${cfg.lineFmt(r[cfg.line.key])}</strong></div>`;
    showTip(html, ev);
  });
  hit.addEventListener("mouseleave", () => { cross.style.opacity = 0; hideTip(); });
  svg.appendChild(hit);
  host.appendChild(svg);
}

/* ============================================================ render */
function setPeriod(from, to, preset){
  STATE.from = from; STATE.to = to; STATE.preset = preset || "custom";
  document.getElementById("from").value = from;
  document.getElementById("to").value = to;
  document.querySelectorAll("[data-preset]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.preset === STATE.preset));
  refresh();
}

/* Decide qual visão renderizar conforme a aba ativa (dashboard × relatório). */
function refresh(){
  const rep = STATE.tab === "report";
  const dv = document.getElementById("dashView"), rv = document.getElementById("reportView");
  if (dv) dv.hidden = rep;
  if (rv) rv.hidden = !rep;
  if (rep) renderReport(); else render();
}

function deltaHTML(cur, prev, fmt, higherIsBetter){
  if (!STATE.compare) return "";
  const bad = higherIsBetter === false;
  if (prev === null || prev === undefined || !isFinite(prev) || prev === 0){
    if (cur === null || !isFinite(cur) || cur === 0) return `<span class="flat">—</span> vs anterior`;
    return `<span class="up">novo</span> vs anterior (0)`;
  }
  if (cur === null || !isFinite(cur)) return `<span class="flat">—</span> vs ${fmt(prev)}`;
  const ch = (cur - prev)/Math.abs(prev);
  const cls = Math.abs(ch) < 0.0005 ? "flat" : ((ch > 0) !== bad ? "up" : "down");
  const arrow = Math.abs(ch) < 0.0005 ? "→" : (ch > 0 ? "▲" : "▼");
  return `<span class="${cls}">${arrow} ${nf1.format(Math.abs(ch)*100)}%</span> vs ${fmt(prev)}`;
}

const RAW = ["spend","gross","imp","clk","lpv","ic","sales","rev"];

/* KPIs secundários (abaixo do hero Investimento→Receita→ROAS) */
const SUB = [
  {k:"sales", label:"Vendas",       fmt:M.int,   better:true},
  {k:"lucro", label:"Resultado",    fmt:M.money, better:true, hint:"receita − investimento"},
  {k:"cac",   label:"CAC",          fmt:M.money, better:false, hint:"custo por venda"},
  {k:"ticket",label:"Ticket médio", fmt:M.money, better:true},
  {k:"cpl",   label:"CPL",          fmt:M.money, better:false, hint:"custo/page view"},
  {k:"cpc",   label:"CPC",          fmt:M.money, better:false},
  {k:"cpm",   label:"CPM",          fmt:M.money, better:false},
  {k:"ctr",   label:"CTR",          fmt:M.pct,   better:true},
  {k:"conv",  label:"Conversão",    fmt:M.pct,   better:true, hint:"vendas/cliques"}
];

/* Saúde do funil ancorada no NÚMERO DO CLIENTE, não em benchmark de mercado:
   teto de CAC = R$ 110. Tudo (bandas, ROAS, tetos de CPC/CPM) é derivado dele. */
const CAC_GOAL = 110;   // teto de CAC definido pelo cliente (R$)
const TICKET   = 29;    // ticket do produto (R$) — usado só p/ derivar o piso de ROAS = ticket/teto

/* Bandas de referência do funil pós-clique (rules-of-thumb de mercado, EDITÁVEIS).
   Todas "quanto maior melhor": rate ≥ good = 🟢 · entre good e bad = 🟡 · < bad = 🔴.
   Ajuste os números aqui pra mudar como os insights classificam cada etapa. */
const FUNNEL_BANDS = {
  cr:        {label:"Connect rate (clique→página)", good:0.80, bad:0.60,
              advice:"perda técnica — checar velocidade de carregamento e o pixel/rastreamento da página"},
  lpCheck:   {label:"Página → checkout",            good:0.20, bad:0.10,
              advice:"a página/VSL não está levando gente ao checkout — testar oferta, título, prova social e CTA"},
  convCheck: {label:"Checkout → compra",            good:0.50, bad:0.35,
              advice:"fricção no checkout — no Brasil comece pelo Pix fácil; depois campos, opções de pagamento e gatilhos de confiança"}
};
function stageStatus(v, band){
  if (v == null || !isFinite(v)) return null;
  if (v >= band.good) return {level:"good", cls:"g", word:"saudável"};
  if (v >= band.bad)  return {level:"warn", cls:"y", word:"atenção"};
  return {level:"bad", cls:"r", word:"ruim"};
}

/* ---- delta compacto (só a seta + %) p/ o hero ---- */
function miniDelta(cur, prev, better){
  if (!STATE.compare || prev == null || !isFinite(prev) || prev === 0 || cur == null || !isFinite(cur))
    return `<span class="flat">—</span>`;
  const ch = (cur - prev)/Math.abs(prev);
  const ar = Math.abs(ch) < 0.0005 ? "→" : (ch > 0 ? "▲" : "▼");
  let cls;
  if (better === null) cls = "flat";
  else { const bad = better === false; cls = Math.abs(ch) < 0.0005 ? "flat" : ((ch > 0) !== bad ? "up" : "down"); }
  return `<span class="${cls}">${ar} ${nf1.format(Math.abs(ch)*100)}%</span>`;
}

/* ============================================================ saúde geral */
/* Nota 0–100 a partir do "% do teto" (pct = valor ÷ teto, p/ métricas de custo).
   Bandas do cliente: ≤60% Saudável · 60–80% Bom · 80–100% Atenção · >100% Crítico. */
function bandScore(pct){
  if (pct == null || !isFinite(pct)) return null;
  if (pct <= 0.6) return 100 - (pct/0.6)*20;          // 100 → 80  (Saudável)
  if (pct <= 0.8) return 80  - ((pct-0.6)/0.2)*20;    //  80 → 60  (Bom)
  if (pct <= 1.0) return 60  - ((pct-0.8)/0.2)*20;    //  60 → 40  (Atenção)
  return Math.max(0, 40 - (pct-1)*40);                //  40 → 0   (Crítico, zera em 200% do teto)
}
const scoreColor = s => s == null ? "var(--ink-3)" : s >= 60 ? "var(--good)" : s >= 40 ? "var(--warning)" : "var(--critical)";
const bandLabel  = s => s == null ? "sem vendas" : s >= 80 ? "Saudável" : s >= 60 ? "Bom" : s >= 40 ? "Atenção" : "Crítico";

/* Saúde = padrão do CAC vs teto R$110. ROAS é o espelho (ticket/CAC); CPC e CPM
   recebem o teto que, com a conversão ATUAL do funil, segura o CAC no teto. */
function health(cur){
  const T = CAC_GOAL;
  const roasFloor = TICKET / T;                                  // piso de ROAS = 29/110
  const cpcCeil = (cur.conv != null && isFinite(cur.conv)) ? T * cur.conv : null;   // teto CPC = 110 × vendas/clique
  const impSale = div(cur.sales, cur.imp);
  const cpmCeil = impSale != null ? T * impSale * 1000 : null;                       // teto CPM = 110 × vendas/impressão × 1000

  const pctCac  = cur.cac  != null && isFinite(cur.cac)  ? cur.cac / T : null;
  const pctRoas = cur.roas == null || !isFinite(cur.roas) ? null : (cur.roas > 0 ? roasFloor / cur.roas : 5);
  const pctCpc  = (cur.cpc != null && cpcCeil) ? cur.cpc / cpcCeil : null;
  const pctCpm  = (cur.cpm != null && cpmCeil) ? cur.cpm / cpmCeil : null;

  const bars = [
    {label:"CAC",  valueStr:M.money(cur.cac),  limitStr:`teto ${M.money(T)}`,        score:bandScore(pctCac)},
    {label:"ROAS", valueStr:M.x(cur.roas),     limitStr:`mín ${M.x(roasFloor)}`,     score:bandScore(pctRoas)},
    {label:"CPC",  valueStr:M.money(cur.cpc),  limitStr:cpcCeil != null ? `teto ${M.money(cpcCeil)}` : "teto —", score:bandScore(pctCpc)},
    {label:"CPM",  valueStr:M.money(cur.cpm),  limitStr:cpmCeil != null ? `teto ${M.money(cpmCeil)}` : "teto —", score:bandScore(pctCpm)}
  ];
  const score = bandScore(pctCac);
  return {score: score == null ? null : Math.round(score), band: bandLabel(score), bars};
}
function gauge(score, colorVar){
  const s = (score == null || !isFinite(score)) ? 0 : score;
  const r = 54, c = 2*Math.PI*r, off = c*(1 - s/100);
  const disp = (score == null || !isFinite(score)) ? "—" : Math.round(score);
  return `<div class="gauge"><svg viewBox="0 0 132 132" width="132" height="132">
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--plane)" stroke-width="12"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="${colorVar}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg><div class="gv"><b>${disp}</b><span>de 100</span></div></div>`;
}
